server.address=127.0.0.1
server.port=18180
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=16
server.error.include-message=never
server.error.include-stacktrace=never
spring.application.name=vrspace-loopback-release-evaluation
spring.main.banner-mode=off
spring.jmx.enabled=false
spring.neo4j.uri=bolt://127.0.0.1:17687
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientWebSecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration,org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,org.springframework.ai.vectorstore.neo4j.autoconfigure.Neo4jVectorStoreAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
org.vrspace.db.embedded=true
org.vrspace.db.cleanup=false
org.vrspace.server.guestAllowed=true
org.vrspace.server.createWorlds=true
org.vrspace.server.maxSessions=4
org.vrspace.server.allowedOrigins=http://127.0.0.1:4176
org.vrspace.server.websocketSessions=true
org.vrspace.server.available=false
org.vrspace.server.selenium-enabled=false
org.vrspace.server.writeback.enabled=true
org.vrspace.server.writeback.delay=1000
org.vrspace.oauth2.enabled=false
org.vrspace.ollama.enabled=false
openvidu.publicurl=none
openvidu.secret=none
logging.level.root=INFO
logging.level.org.vrspace=INFO
